apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: posfiap
  labels:
    app.kubernetes.io/name: posfiap
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: alembic-migrate
          image: gddarkness/fiap-oficina:latest
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: posfiap-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: posfiap-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: posfiap-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: posfiap-secrets
                  key: DB_NAME
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: posfiap-secrets
                  key: JWT_SECRET_KEY

      containers:
        - name: api
          image: gddarkness/fiap-oficina:latest
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
              hostPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: posfiap-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: posfiap-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: posfiap-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: posfiap-secrets
                  key: DB_NAME
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: posfiap-secrets
                  key: JWT_SECRET_KEY
            - name: WEBHOOK_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: posfiap-secrets
                  key: WEBHOOK_SHARED_SECRET

          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
