# ─────────────────────────────────────────────────────────────
# New Relic Python Agent Configuration
# ─────────────────────────────────────────────────────────────

[newrelic]
# Nome da aplicação exibido no New Relic One
app_name = fiap-officine-api

# Habilitar agente (inicia ativado)
monitor_mode = true

# Nível de log do agente (info, debug, warning)
log_level = info

# Habilita Distributed Tracing para correlação ponta a ponta
distributed_tracing.enabled = true

# Captura de transações lentas (Threshold: 0.5s)
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = 0.5
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5
transaction_tracer.explain_enabled = true
transaction_tracer.explain_threshold = 0.5

# Captura e agregação de erros
error_collector.enabled = true
error_collector.ignore_classes = fastapi.exceptions.HTTPException

# Métricas de Thread e Garbage Collection
thread_profiler.enabled = true

# Encaminhamento de logs estruturados com contexto de traces
application_logging.enabled = true
application_logging.forwarding.enabled = true
application_logging.forwarding.max_samples_stored = 10000
application_logging.metrics.enabled = true
application_logging.local_decorating.enabled = true

# Coleta de atributos customizados (correlation_id, request_id, etc.)
attributes.enabled = true
attributes.include = correlation_id, request_id, http_method, request_path, os_id, cliente_id

# Configurações de ambiente
[newrelic:development]
monitor_mode = false

[newrelic:homologation]
app_name = fiap-officine-api-homolog

[newrelic:production]
app_name = fiap-officine-api-prod
