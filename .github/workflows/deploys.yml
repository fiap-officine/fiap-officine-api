name: Deploys

on:
  push:
    branches: [main, develop, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create .env
        run: |
          cat > .env << EOF
          DB_USER=${{ secrets.DB_USER || 'dbadmin' }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD || 'password' }}
          DB_HOST=${{ secrets.DB_HOST || 'localhost' }}
          DB_PORT=${{ secrets.DB_PORT || '5432' }}
          DB_NAME=${{ secrets.DB_NAME || 'officine_db' }}
          REDIS_HOST=${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}
          REDIS_DB=${{ secrets.REDIS_DB || '0' }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY || 'default-secret-key-change-in-production-12345' }}
          JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM || 'HS256' }}
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.JWT_ACCESS_TOKEN_EXPIRE_MINUTES || '60' }}
          APP_ENV=${{ secrets.APP_ENV || 'production' }}
          APP_DEBUG=${{ secrets.APP_DEBUG || 'false' }}
          WEBHOOK_SHARED_SECRET=${{ secrets.WEBHOOK_SHARED_SECRET || 'change-me' }}
          EOF

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Build Docker image
        run: docker build -t fiap-oficina:${{ github.sha }} .

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Validate Terraform
        run: |
          cd infra
          terraform init -backend=false
          terraform validate

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/configmap.yaml
          kubectl apply --dry-run=client -f k8s/postgres-deployment.yaml
          kubectl apply --dry-run=client -f k8s/postgres-svc.yaml
          kubectl apply --dry-run=client -f k8s/redis-deployment.yaml
          kubectl apply --dry-run=client -f k8s/redis-svc.yaml
          kubectl apply --dry-run=client -f k8s/api-deployment.yaml
          kubectl apply --dry-run=client -f k8s/api-svc.yaml
          kubectl apply --dry-run=client -f k8s/ingress.yaml
          kubectl apply --dry-run=client -f k8s/api-hpa.yaml
          kubectl apply --dry-run=client -f k8s/worker-deployment.yaml

      # Deploy Automático: Homologação (Branch develop)
      - name: Deploy to Kubernetes (Homologation)
        if: github.ref == 'refs/heads/develop' && (env.KUBE_CONFIG_DATA != '' || env.KUBE_CONFIG_HOMOLOG != '')
        env:
          KUBE_CONFIG_HOMOLOG: ${{ secrets.KUBE_CONFIG_HOMOLOG || secrets.KUBE_CONFIG_DATA }}
          DB_USER: ${{ secrets.HOMOLOG_DB_USER || secrets.DB_USER || 'officine_admin' }}
          DB_PASSWORD: ${{ secrets.HOMOLOG_DB_PASSWORD || secrets.DB_PASSWORD || 'password' }}
          DB_NAME: ${{ secrets.HOMOLOG_DB_NAME || secrets.DB_NAME || 'officine' }}
          JWT_SECRET_KEY: ${{ secrets.HOMOLOG_JWT_SECRET_KEY || secrets.JWT_SECRET_KEY || 'default-secret-key-homolog-12345' }}
          WEBHOOK_SHARED_SECRET: ${{ secrets.HOMOLOG_WEBHOOK_SHARED_SECRET || secrets.WEBHOOK_SHARED_SECRET || 'change-me' }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_HOMOLOG" | base64 -d > ~/.kube/config
          # 1. Aplicar namespace
          kubectl apply -f k8s/namespace.yaml
          # 2. Criar secret
          cat > /tmp/secret.yaml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: posfiap-secrets
            namespace: posfiap
          type: Opaque
          stringData:
            DB_USER: $DB_USER
            DB_PASSWORD: $DB_PASSWORD
            DB_NAME: $DB_NAME
            POSTGRES_USER: $DB_USER
            POSTGRES_PASSWORD: $DB_PASSWORD
            POSTGRES_DB: $DB_NAME
            JWT_SECRET_KEY: $JWT_SECRET_KEY
            WEBHOOK_SHARED_SECRET: $WEBHOOK_SHARED_SECRET
          EOF
          kubectl apply -f /tmp/secret.yaml
          # 3. Aplicar manifests
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl apply -f k8s/redis-svc.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-svc.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/api-hpa.yaml
          kubectl apply -f k8s/worker-deployment.yaml

      # Deploy Automático: Produção (Branch main)
      - name: Deploy to Kubernetes (Production)
        if: github.ref == 'refs/heads/main' && (env.KUBE_CONFIG_DATA != '' || env.KUBE_CONFIG_PROD != '')
        env:
          KUBE_CONFIG_PROD: ${{ secrets.KUBE_CONFIG_PROD || secrets.KUBE_CONFIG_DATA }}
          DB_USER: ${{ secrets.PROD_DB_USER || secrets.DB_USER || 'officine_admin' }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD || secrets.DB_PASSWORD || 'password' }}
          DB_NAME: ${{ secrets.PROD_DB_NAME || secrets.DB_NAME || 'officine' }}
          JWT_SECRET_KEY: ${{ secrets.PROD_JWT_SECRET_KEY || secrets.JWT_SECRET_KEY || 'default-secret-key-prod-12345' }}
          WEBHOOK_SHARED_SECRET: ${{ secrets.PROD_WEBHOOK_SHARED_SECRET || secrets.WEBHOOK_SHARED_SECRET || 'change-me' }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_PROD" | base64 -d > ~/.kube/config
          # 1. Aplicar namespace
          kubectl apply -f k8s/namespace.yaml
          # 2. Criar secret
          cat > /tmp/secret.yaml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: posfiap-secrets
            namespace: posfiap
          type: Opaque
          stringData:
            DB_USER: $DB_USER
            DB_PASSWORD: $DB_PASSWORD
            DB_NAME: $DB_NAME
            POSTGRES_USER: $DB_USER
            POSTGRES_PASSWORD: $DB_PASSWORD
            POSTGRES_DB: $DB_NAME
            JWT_SECRET_KEY: $JWT_SECRET_KEY
            WEBHOOK_SHARED_SECRET: $WEBHOOK_SHARED_SECRET
          EOF
          kubectl apply -f /tmp/secret.yaml
          # 3. Aplicar manifests
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl apply -f k8s/redis-svc.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-svc.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/api-hpa.yaml
          kubectl apply -f k8s/worker-deployment.yaml

      - name: Skip deployment notice
        if: env.KUBE_CONFIG_DATA == '' && env.KUBE_CONFIG_HOMOLOG == '' && env.KUBE_CONFIG_PROD == ''
        run: echo "Nenhuma credencial de cluster Kubernetes configurada; o deployment no cluster foi ignorado."
