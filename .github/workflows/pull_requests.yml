name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop, staging]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create .env
        run: |
          cat > .env << EOF
          DB_USER=${{ secrets.DB_USER || 'dbadmin' }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD || 'password' }}
          DB_HOST=${{ secrets.DB_HOST || 'localhost' }}
          DB_PORT=${{ secrets.DB_PORT || '5432' }}
          DB_NAME=${{ secrets.DB_NAME || 'officine_db' }}
          REDIS_HOST=${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}
          REDIS_DB=${{ secrets.REDIS_DB || '0' }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY || 'default-secret-key-change-in-production-12345' }}
          JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM || 'HS256' }}
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.JWT_ACCESS_TOKEN_EXPIRE_MINUTES || '60' }}
          APP_ENV=${{ secrets.APP_ENV || 'development' }}
          APP_DEBUG=${{ secrets.APP_DEBUG || 'false' }}
          WEBHOOK_SHARED_SECRET=${{ secrets.WEBHOOK_SHARED_SECRET || 'change-me' }}
          EOF

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest
