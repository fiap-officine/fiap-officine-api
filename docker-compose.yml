services:
  db:
    image: postgres:16-alpine 
    container_name: oficina_db
    environment:
      POSTGRES_USER: fiaptech
      POSTGRES_PASSWORD: fiaptech123
      POSTGRES_DB: oficina_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiaptech -d oficina_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oficina_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: gddarkness/fiap-oficina:latest
    container_name: oficina_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uv run sh -c "alembic upgrade head &&
                    uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app

  worker:
    build: .
    image: gddarkness/fiap-oficina:latest
    container_name: oficina_worker
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run python -m app.worker

volumes:
  postgres_data:
